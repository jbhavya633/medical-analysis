<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Advanced Multi-modality Medical Analysis Platform with AI Integration" />
    <meta name="theme-color" content="#14b8a6" />
    <title>MedFusion AI - Advanced Medical Analysis Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script type="module">
      // Preload critical resources
      const preloads = [
        '/src/main.tsx',
        '/src/styles/globals.css'
      ];
      preloads.forEach(href => {
        const link = document.createElement('link');
        link.rel = 'modulepreload';
        link.href = href;
        document.head.appendChild(link);
      });
    </script>
  </head>
  <body class="h-full antialiased bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-50">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
